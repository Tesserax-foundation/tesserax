[package]
edition = "2021"
name = "litep2p"
version = "0.15.3"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Peer-to-peer networking library"
readme = "README.md"
license = "MIT"
repository = "https://github.com/paritytech/litep2p"

[package.metadata.cargo-machete]
ignored = ["serde_millis"]

[features]
fuzz = [
    "serde/derive",
    "serde/rc",
    "bytes/serde",
    "dep:serde_millis",
    "cid/serde",
    "multihash/serde",
]
websocket = ["dep:tokio-tungstenite"]

[lib]
name = "litep2p"
path = "src/lib.rs"

[dependencies.aws-lc-rs]
version = "1.18.2"

[dependencies.futures-rustls]
version = "0.26.0"
default-features = false
features = ["aws-lc-rs", "logging"]

[dependencies.rustls]
version = "0.23.46"
default-features = false
features = ["std", "aws_lc_rs", "logging"]

[dependencies.webpki]
package = "rustls-webpki"
version = "0.103.15"
default-features = false
features = ["aws-lc-rs", "std"]

[dependencies.async-trait]
version = "0.1.88"

[dependencies.bs58]
version = "0.5.1"

[dependencies.bytes]
version = "1.11.1"

[dependencies.cid]
version = "0.11.2"

[dependencies.enum-display]
version = "0.1.4"

[dependencies.futures]
version = "0.3.27"

[dependencies.futures-timer]
version = "3.0.3"

[dependencies.hickory-resolver]
version = "0.26.1"

[dependencies.indexmap]
version = "2.9.0"
features = ["std"]

[dependencies.ip_network]
version = "0.4"

[dependencies.libc]
version = "0.2.158"

[dependencies.mockall]
version = "0.13.1"

[dependencies.multiaddr]
version = "0.18.2"

[dependencies.multibase]
version = "0.9.2"

[dependencies.multihash]
version = "0.19.4"
features = ["std"]
default-features = false

[dependencies.multihash-codetable]
version = "0.2.1"
features = [
    "sha2",
    "blake2b",
    "sha3",
]
default-features = false

[dependencies.network-interface]
version = "2.0.1"

[dependencies.parking_lot]
version = "0.12.3"

[dependencies.pin-project]
version = "1.1.10"

[dependencies.prost]
version = "0.13.5"

[dependencies.rand]
version = "0.8.0"
features = ["getrandom"]

[dependencies.serde]
version = "1.0.158"

[dependencies.serde_millis]
version = "0.1"
optional = true

[dependencies.sha2]
version = "0.11"

[dependencies.simple-dns]
version = "0.11.0"

[dependencies.smallvec]
version = "1.15.0"

[dependencies.socket2]
version = "0.5.9"
features = ["all"]

[dependencies.thiserror]
version = "2.0.12"

[dependencies.tokio]
version = "1.45.0"
features = [
    "rt",
    "net",
    "io-util",
    "time",
    "macros",
    "sync",
    "parking_lot",
]

[dependencies.tokio-stream]
version = "0.1.17"

[dependencies.tokio-tungstenite]
version = "0.27.0"
features = [
    "rustls-tls-native-roots",
    "url",
]
optional = true

[dependencies.tokio-util]
version = "0.7.15"
features = [
    "compat",
    "io",
    "codec",
]

[dependencies.tracing]
version = "0.1.40"
features = ["log"]

[dependencies.uint]
version = "0.10.0"

[dependencies.unsigned-varint]
version = "0.8.0"
features = ["codec"]

[dependencies.url]
version = "2.5.4"

[dependencies.yamux]
version = "0.13.10"

[dependencies.zeroize]
version = "1.8.1"

[dev-dependencies.futures_ringbuf]
version = "0.4.0"

[dev-dependencies.hex-literal]
version = "1.0.0"

[dev-dependencies.quickcheck]
version = "1.0.3"

[dev-dependencies.serde_json]
version = "1.0.140"

[dev-dependencies.tracing-subscriber]
version = "0.3.20"
features = ["env-filter"]

[build-dependencies.prost-build]
version = "0.14"

[profile.release]
debug = 2
