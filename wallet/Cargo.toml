[package]
name = "tesserax-wallet"
description = "Command line wallet of Tesserax: post-quantum accounts, transfers, AI agents, micropayments and tasks."
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tesserax-wallet"
path = "src/main.rs"

[dependencies]
argon2 = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true, default-features = true }
clap = { workspace = true, features = ["derive", "env"] }
getrandom = { workspace = true, default-features = true }
rpassword = { workspace = true }
serde = { workspace = true }
hex = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
tesserax-sdk = { workspace = true, features = ["shielded"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
