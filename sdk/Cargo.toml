[package]
name = "tesserax-sdk"
description = "Rust SDK of Tesserax: ML-DSA accounts, transfers, agent delegations and the agent registry."
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
bip39 = { workspace = true }
codec = { workspace = true, default-features = true, features = ["derive"] }
getrandom = { workspace = true, default-features = true }
serde = { workspace = true }
serde_json = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
subxt = { workspace = true }
tesserax-crypto = { workspace = true, default-features = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tesserax-runtime = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
