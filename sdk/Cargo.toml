[package]
name = "tesserax-sdk"
description = "Rust SDK of Tesserax: ML-DSA accounts, transfers, agent delegations, the agent registry and smart contracts."
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
alloy-core = { workspace = true, features = ["dyn-abi", "json-abi", "std"] }
base64 = { workspace = true }
bip39 = { workspace = true }
codec = { workspace = true, default-features = true, features = ["derive"] }
futures = { workspace = true }
getrandom = { workspace = true, default-features = true }
jsonrpsee = { workspace = true, features = ["async-client", "client-ws-transport-tls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-platform-verifier = "0.7.1"
serde = { workspace = true }
serde_json = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
subxt = { workspace = true }
tesserax-crypto = { workspace = true, default-features = true }
tesserax-shielded-wallet = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[features]
# Private transactions with the shielded pool: proofs and note encryption.
shielded = ["dep:tesserax-shielded-wallet"]

[dev-dependencies]
tesserax-runtime = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
