[package]
name = "tesserax-shielded-wallet"
description = "Client of the Tesserax shielded pool: keys, notes, synchronization and proven transactions, for native wallets and WebAssembly."
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage = "https://tesserax.app"
documentation = "https://docs.tesserax.app"
keywords = ["tesserax", "post-quantum", "ml-dsa", "blockchain", "ai-agents"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
blake2 = { version = "0.10.6", default-features = false }
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
codec = { workspace = true, default-features = true, features = ["derive"] }
tesserax-shielded = { workspace = true, default-features = true }
thiserror = { workspace = true }
