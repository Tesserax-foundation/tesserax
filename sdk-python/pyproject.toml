[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tesserax"
version = "0.4.0"
description = "Python SDK of Tesserax: ML-DSA accounts, transfers, AI agent delegations, the agent registry, smart contracts, private transactions and atomic swaps."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "substrate-interface>=1.8.1,<2",
    "dilithium-py>=1.5.1,<2",
    "eth-abi>=5.2,<6",
]

[project.optional-dependencies]
# Private transactions: the shielded wallet runs as WebAssembly in wasmtime.
shielded = ["wasmtime>=50,<51"]
# Atomic swaps: the payment side on the EVM chains, with web3.py, and on Bitcoin, with embit.
swaps = ["web3>=7,<8", "embit>=0.8,<0.9"]
test = ["pytest>=8", "wasmtime>=50,<51", "web3>=7,<8", "embit>=0.8,<0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/tesserax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["chain: needs a running development chain (set TESSERAX_URL)"]
