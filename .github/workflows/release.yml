# Release of a tag `v<version>`, the version of the node in node/Cargo.toml:
#
# - the runtime, built reproducibly (scripts/build-runtime.sh), with its BLAKE2-256 hash;
# - the node, the command line wallet and the pool for Linux (x64, and arm64 when the repository
#   is public) and macOS (Apple silicon, Intel), with their SHA-256;
# - a Docker image of the three on the GitHub container registry;
# - a draft GitHub release with all of them, to review and publish.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: version
        name: Version of the node
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' node/Cargo.toml | head -1)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the node version $version (node/Cargo.toml)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: platforms
        name: Platforms
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          # Linux arm64 runners are free for public repositories only.
          platforms='[
            {"name": "linux-x64", "os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu"},
            {"name": "macos-arm64", "os": "macos-15", "target": "aarch64-apple-darwin"},
            {"name": "macos-x64", "os": "macos-15", "target": "x86_64-apple-darwin"}'
          if [ "$PRIVATE" != "true" ]; then
            platforms="$platforms"',
            {"name": "linux-arm64", "os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu"}'
          fi
          echo "platforms=$(echo "$platforms]" | jq -c .)" >> "$GITHUB_OUTPUT"

  runtime:
    name: Runtime
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Reproducible build
        run: scripts/build-runtime.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: runtime
          path: target/runtime-release/

  binaries:
    name: Binaries (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev protobuf-compiler cmake pkg-config

      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Rust toolchain
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p tesserax-node -p tesserax-wallet -p tesserax-pool

      - name: Package
        id: package
        run: |
          name="tesserax-${{ needs.version.outputs.version }}-${{ matrix.name }}"
          mkdir "$name"
          for binary in tesserax tesserax-wallet tesserax-pool; do
            cp "target/${{ matrix.target }}/release/$binary" "$name/"
          done
          cp LICENSE LICENSE-APACHE2 LICENSE-GPL3 "$name/"
          # Binaries built for this machine run: check that they start.
          if [ "${{ matrix.name }}" != "macos-x64" ]; then
            "$name/tesserax" --version
            "$name/tesserax-wallet" --version
            "$name/tesserax-pool" --version
          fi
          tar -czf "$name.tar.gz" "$name"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binaries-${{ matrix.name }}
          path: ${{ steps.package.outputs.archive }}

  docker:
    name: Docker image
    needs: [version, binaries]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: binaries-linux-x64
      - name: Binaries and chain specifications
        run: |
          tar -xzf tesserax-*-linux-x64.tar.gz && mv tesserax-*-linux-x64 docker/binaries
          cp -r chain-specs docker/chain-specs
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Image name
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/tesserax" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: docker
          file: docker/Dockerfile.release
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  release:
    name: Draft release
    needs: [version, runtime, binaries, docker]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum -- *.tar.gz tesserax_runtime.compact.compressed.wasm > SHA256SUMS
          cat SHA256SUMS
          cat tesserax_runtime.json
      - uses: softprops/action-gh-release@v3.0.3
        with:
          draft: true
          name: Tesserax ${{ needs.version.outputs.version }}
          body: |
            Node, command line wallet and mining pool of Tesserax ${{ needs.version.outputs.version }}.

            - Runtime: `tesserax_runtime.compact.compressed.wasm`, built reproducibly with `scripts/build-runtime.sh`; its BLAKE2-256 hash is in `tesserax_runtime.json`.
            - Docker: `ghcr.io/${{ github.repository_owner }}/tesserax:${{ needs.version.outputs.version }}`.
            - Check the archives against `SHA256SUMS`.
          files: |
            artifacts/*.tar.gz
            artifacts/tesserax_runtime.compact.compressed.wasm
            artifacts/tesserax_runtime.json
            artifacts/SHA256SUMS
