# Builds and tests the node, the runtime, the wallet and the pool on every push to main and every
# pull request. Once a push to main passes, its binaries are published as the Docker image
# ghcr.io/<owner>/tesserax:main. Nothing here mines: the terms of hosted runners forbid it. The
# tests on a mined development chain (the SDKs and the explorer) run on our own machines,
# scripts/chain-tests.sh.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Build and test
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev protobuf-compiler cmake pkg-config

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: release

      - name: Build
        run: cargo build --release --locked -p tesserax-node -p tesserax-wallet -p tesserax-pool

      - name: Test
        run: cargo test --release --locked --workspace

      - name: Benchmarks compile
        run: cargo check --release --locked -p tesserax-node --features runtime-benchmarks

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tesserax-linux-x64
          path: |
            target/release/tesserax
            target/release/tesserax-wallet
            target/release/tesserax-pool
          retention-days: 7

  image:
    name: Docker image
    needs: rust
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: tesserax-linux-x64
          path: docker/binaries

      - name: Binaries and chain specifications
        run: |
          chmod +x docker/binaries/*
          cp -r chain-specs docker/chain-specs

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Image name
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/tesserax" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7.4.0
        with:
          context: docker
          file: docker/Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
