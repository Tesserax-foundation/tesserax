[package]
name = "tesserax-runtime"
description = "The Tesserax runtime."
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive", "serde"], workspace = true }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }

# frame
frame-executive = { workspace = true }
frame-metadata-hash-extension = { workspace = true }
frame-support = { features = ["experimental"], workspace = true }
frame-system = { workspace = true }
frame-try-runtime = { optional = true, workspace = true }

# Tesserax
alloy-core = { workspace = true, features = ["sol-types"] }
tesserax-crypto = { workspace = true }

# frame pallets
pallet-agent-registry = { workspace = true }
pallet-agents = { workspace = true }
pallet-allocations = { workspace = true }
pallet-balances = { workspace = true }
pallet-channels = { workspace = true }
pallet-difficulty = { workspace = true }
pallet-emission = { workspace = true }
pallet-collective = { workspace = true }
pallet-conviction-voting = { workspace = true }
pallet-multisig = { workspace = true }
pallet-preimage = { workspace = true }
pallet-referenda = { workspace = true }
pallet-scheduler = { workspace = true }
pallet-revive = { workspace = true }
pallet-shielded = { workspace = true }
pallet-tasks = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-transaction-payment = { workspace = true }
pallet-vesting = { workspace = true }
pallet-whitelist = { workspace = true }

# primitives
sp-api = { workspace = true }
sp-block-builder = { workspace = true }
sp-consensus-pow = { workspace = true }
sp-core = { features = ["serde"], workspace = true }
sp-genesis-builder = { workspace = true }
sp-inherents = { workspace = true }
sp-offchain = { workspace = true }
sp-runtime = { features = ["serde"], workspace = true }
sp-session = { workspace = true }
sp-storage = { workspace = true }
sp-transaction-pool = { workspace = true }
sp-version = { features = ["serde"], workspace = true }
sp-weights = { workspace = true }

# RPC related
frame-system-rpc-runtime-api = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }

# Used for runtime benchmarking
frame-benchmarking = { optional = true, workspace = true }
frame-system-benchmarking = { optional = true, workspace = true }

[dev-dependencies]
sp-io = { workspace = true, default-features = true }
tesserax-shielded = { workspace = true, default-features = true }

[build-dependencies]
substrate-wasm-builder = { optional = true, workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-executive/std",
	"frame-metadata-hash-extension/std",
	"frame-support/std",
	"frame-system-benchmarking?/std",
	"frame-system-rpc-runtime-api/std",
	"frame-system/std",
	"frame-try-runtime?/std",
	"pallet-agent-registry/std",
	"pallet-agents/std",
	"pallet-allocations/std",
	"pallet-balances/std",
	"pallet-channels/std",
	"pallet-difficulty/std",
	"pallet-emission/std",
	"pallet-collective/std",
	"pallet-conviction-voting/std",
	"pallet-multisig/std",
	"pallet-preimage/std",
	"pallet-referenda/std",
	"pallet-scheduler/std",
	"pallet-revive/std",
	"pallet-shielded/std",
	"alloy-core/std",
	"pallet-tasks/std",
	"pallet-timestamp/std",
	"pallet-transaction-payment-rpc-runtime-api/std",
	"pallet-transaction-payment/std",
	"pallet-vesting/std",
	"pallet-whitelist/std",
	"scale-info/std",
	"serde_json/std",
	"sp-api/std",
	"sp-block-builder/std",
	"sp-consensus-pow/std",
	"sp-core/std",
	"sp-genesis-builder/std",
	"sp-inherents/std",
	"sp-offchain/std",
	"sp-runtime/std",
	"sp-session/std",
	"sp-storage/std",
	"sp-transaction-pool/std",
	"sp-version/std",
	"sp-weights/std",
	"substrate-wasm-builder",
	"tesserax-crypto/std",
]
# Governance periods of minutes instead of days, for development chains only: never for the
# runtime of a public network.
fast-runtime = []
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system-benchmarking/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-agent-registry/runtime-benchmarks",
	"pallet-agents/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-channels/runtime-benchmarks",
	"pallet-difficulty/runtime-benchmarks",
	"pallet-emission/runtime-benchmarks",
	"pallet-collective/runtime-benchmarks",
	"pallet-conviction-voting/runtime-benchmarks",
	"pallet-multisig/runtime-benchmarks",
	"pallet-preimage/runtime-benchmarks",
	"pallet-referenda/runtime-benchmarks",
	"pallet-scheduler/runtime-benchmarks",
	"pallet-revive/runtime-benchmarks",
	"pallet-shielded/runtime-benchmarks",
	"pallet-tasks/runtime-benchmarks",
	"pallet-timestamp/runtime-benchmarks",
	"pallet-transaction-payment/runtime-benchmarks",
	"pallet-vesting/runtime-benchmarks",
	"pallet-whitelist/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-executive/try-runtime",
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"frame-try-runtime/try-runtime",
	"pallet-agent-registry/try-runtime",
	"pallet-agents/try-runtime",
	"pallet-allocations/try-runtime",
	"pallet-balances/try-runtime",
	"pallet-channels/try-runtime",
	"pallet-difficulty/try-runtime",
	"pallet-emission/try-runtime",
	"pallet-collective/try-runtime",
	"pallet-conviction-voting/try-runtime",
	"pallet-multisig/try-runtime",
	"pallet-preimage/try-runtime",
	"pallet-referenda/try-runtime",
	"pallet-scheduler/try-runtime",
	"pallet-revive/try-runtime",
	"pallet-shielded/try-runtime",
	"pallet-tasks/try-runtime",
	"pallet-timestamp/try-runtime",
	"pallet-transaction-payment/try-runtime",
	"pallet-vesting/try-runtime",
	"pallet-whitelist/try-runtime",
	"sp-runtime/try-runtime",
]

# Enable the metadata hash generation.
#
# The wasm binary is compiled twice: once to fetch the metadata and generate its hash, then a
# second time with `RUNTIME_METADATA_HASH` set for the `CheckMetadataHash` extension.
metadata-hash = ["substrate-wasm-builder/metadata-hash"]

# Build for an on-chain release.
on-chain-release-build = ["metadata-hash", "sp-api/disable-logging"]
