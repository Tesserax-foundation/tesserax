[package]
name = "tesserax-crypto"
description = "ML-DSA keys, signatures and accounts for Tesserax."
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage = "https://tesserax.app"
documentation = "https://docs.tesserax.app"
keywords = ["tesserax", "post-quantum", "ml-dsa", "blockchain", "ai-agents"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
codec = { features = ["derive", "max-encoded-len"], workspace = true }
getrandom = { workspace = true, optional = true }
ml-dsa = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
sp-core = { workspace = true }
sp-crypto-hashing = { workspace = true }
sp-runtime = { workspace = true }

[dev-dependencies]
hex = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"full_crypto",
	"dep:getrandom",
	"scale-info/std",
	"sp-core/std",
	"sp-crypto-hashing/std",
	"sp-runtime/std",
]
# Signing. Verification is always available.
full_crypto = ["sp-core/full_crypto"]
