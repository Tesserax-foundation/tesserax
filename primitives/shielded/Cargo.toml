[package]
name = "tessera-shielded"
description = "Shielded pool primitives for Tessera: notes, commitments, nullifiers, note tree and note encryption."
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
chacha20poly1305 = { workspace = true, optional = true, features = ["alloc"] }
codec = { features = ["derive", "max-encoded-len"], workspace = true }
getrandom = { workspace = true, optional = true }
ml-kem = { workspace = true, optional = true, features = ["hazmat"] }
p3-field = { workspace = true }
p3-goldilocks = { workspace = true }
p3-symmetric = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
sha3 = { workspace = true, optional = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"dep:chacha20poly1305",
	"dep:getrandom",
	"dep:ml-kem",
	"dep:sha3",
	"scale-info/std",
]
