[package]
name = "tesserax-pow"
description = "RandomTESS proof of work for the Tesserax node: verification, mining and confirmation depth."
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true, default-features = true }
futures = { workspace = true }
hex = { workspace = true, default-features = true }
log = { workspace = true, default-features = true }
parking_lot = { workspace = true, default-features = true }
randomtess = { workspace = true }
sc-client-api = { workspace = true, default-features = true }
sc-consensus = { workspace = true, default-features = true }
sc-consensus-pow = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
sp-api = { workspace = true, default-features = true }
sp-blockchain = { workspace = true, default-features = true }
sp-consensus-pow = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }
tokio = { features = ["io-util", "macros", "net", "rt", "sync", "time"], workspace = true }
